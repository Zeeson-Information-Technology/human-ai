<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f7f7;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#152326">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dce8e7;border-radius:20px;padding:32px;box-shadow:0 12px 30px rgba(15,45,45,.08)">
      <div style="font-size:18px;font-weight:700;color:#087f78">Euman Intelligence</div>
      <h1 style="font-size:24px;line-height:1.25;margin:28px 0 12px;color:#152326">{{heading}}</h1>
      <p style="font-size:15px;line-height:1.7;margin:0 0 18px">Hi {{name}},</p>
      <p style="font-size:15px;line-height:1.7;margin:0 0 18px">Opportunity: <strong>{{opportunity}}</strong></p>
      <div style="background:#eef8f6;border-radius:14px;padding:16px;font-size:15px;line-height:1.6">{{detail}}</div>
      <p style="font-size:15px;line-height:1.7;margin:20px 0 0">{{action}}</p>
      <p style="font-size:12px;color:#708180;margin:28px 0 0">Euman Intelligence · Human and AI intelligence for proposals, bids, and RFPs</p>
    </div>
  </body>
</html>
